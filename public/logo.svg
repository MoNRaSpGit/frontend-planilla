<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono de la app (26/10/2026, pedido explicito): una planilla con un
       lapiz. Adentro de la app sigue todo lo de Logic Lab. -->
  <rect width="512" height="512" rx="112" fill="#1d4ed8"/>
  <!-- tabla del portapapeles -->
  <rect x="112" y="92" width="268" height="340" rx="30" fill="#0f2f8f"/>
  <!-- hoja -->
  <rect x="132" y="120" width="228" height="292" rx="16" fill="#ffffff"/>
  <!-- broche -->
  <rect x="190" y="72" width="112" height="56" rx="18" fill="#facc15"/>
  <rect x="222" y="86" width="48" height="16" rx="8" fill="#0f2f8f"/>
  <!-- grilla de la planilla -->
  <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="178" x2="332" y2="178"/>
    <line x1="160" y1="224" x2="332" y2="224"/>
    <line x1="160" y1="270" x2="332" y2="270"/>
    <line x1="160" y1="316" x2="332" y2="316"/>
    <line x1="246" y1="156" x2="246" y2="380"/>
  </g>
  <!-- tantos anotados -->
  <g fill="#1d4ed8">
    <circle cx="182" cy="201" r="9"/>
    <circle cx="208" cy="201" r="9"/>
    <circle cx="182" cy="247" r="9"/>
  </g>
  <g fill="#dc2626">
    <circle cx="270" cy="201" r="9"/>
    <circle cx="270" cy="247" r="9"/>
    <circle cx="296" cy="247" r="9"/>
    <circle cx="270" cy="293" r="9"/>
  </g>
  <!-- lapiz -->
  <g transform="rotate(40 330 330)">
    <rect x="306" y="188" width="48" height="190" rx="8" fill="#facc15"/>
    <rect x="306" y="188" width="48" height="34" rx="8" fill="#f472b6"/>
    <rect x="306" y="214" width="48" height="12" fill="#94a3b8"/>
    <polygon points="306,378 354,378 330,428" fill="#fde68a"/>
    <polygon points="321,409 339,409 330,428" fill="#0f172a"/>
  </g>
</svg>
